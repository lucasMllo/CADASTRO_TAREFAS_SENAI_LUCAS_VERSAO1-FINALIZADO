<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Painel de Tarefas</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >
</head>

<body class="modo-escuro">

    <div class="foto-topo">
        <img src="unnamed.jpg" alt="Foto">
    </div>

    <div class="cartao-aplicacao">

        <header class="cabecalho-aplicacao">
            <div>
                <span class="subtitulo">ORGANIZAÇÃO</span>
                <h1>Minhas tarefas</h1>
            </div>

            <button
                id="botao-tema"
                class="botao-tema"
                type="button"
                title="Mudar para tema claro"
            >
                <i class="fa-solid fa-sun"></i>
            </button>
        </header>

        <div class="caixa-entrada">

            <input
                type="text"
                id="campo-tarefa"
                placeholder="O que vamos fazer hoje?"
                maxlength="40"
            >

            <button
                id="botao-adicionar"
                class="botao-principal"
                type="button"
            >
                <i class="fa-solid fa-plus"></i>
                <span>Adicionar</span>
            </button>

        </div>

        <div class="titulo-lista">
            <span>Suas tarefas</span>
            <span class="indicador"></span>
        </div>

        <ul id="lista-tarefas" class="lista-tarefas"></ul>

        <footer class="rodape-aplicacao">
            <i class="fa-solid fa-list-check"></i>
            <span id="contador-tarefas">0 tarefas na lista</span>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
